<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beam AI Assistant</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #chat-container { width: 400px; height: 600px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        #header { background: #1a365d; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 18px; max-width: 80%; line-height: 1.4; font-size: 14px; }
        .user { background: #ebf8ff; color: #2b6cb0; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot { background: #f1f5f9; color: #334155; align-self: flex-start; border-bottom-left-radius: 4px; }
        #input-area { padding: 15px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 20px; outline: none; }
        button { background: #3182ce; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2b6cb0; }
        .typing { color: #94a3b8; font-style: italic; font-size: 12px; display: none; padding: 0 15px; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="header">Beam Signage AI Assistant</div>
    <div id="messages">
        <div class="msg bot">Hi! I'm the Beam AI Assistant. How can I help you with your Signage or IT needs today?</div>
    </div>
    <div class="typing" id="typing">Assistant is typing...</div>
    <div id="input-area">
        <input type="text" id="userInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    let sessionId = ""; 

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        input.value = '';
        document.getElementById('typing').style.display = 'block';

        try {
            const response = await fetch('http://localhost:8001/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sessionId, message: text })
            });
            
            const data = await response.json();
            sessionId = data.session_id; 
            
            document.getElementById('typing').style.display = 'none';
            addMessage(data.reply, 'bot');
        } catch (error) {
            document.getElementById('typing').style.display = 'none';
            addMessage("Error connecting to the server.", 'bot');
        }
    }

    function addMessage(text, sender) {
        const msgs = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.textContent = text;
        msgs.appendChild(div);
        msgs.scrollTop = msgs.scrollHeight;
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }
</script>

</body>
</html>
